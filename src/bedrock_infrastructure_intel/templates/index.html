<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEDROCK — Infrastructure & Site Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(18, 26, 43, 0.90);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #f59e0b;
            --text-color: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1rem 1.5rem;
            overflow: hidden;
            background-image: radial-gradient(circle at 10% 10%, rgba(245, 158, 11, 0.08) 0%, transparent 40%);
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; }
        .logo-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        .logo-title { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.5px; }
        .logo-subtitle { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .search-container {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1rem;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
            background: var(--card-bg);
            padding: 0.35rem 0.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            align-items: center;
        }

        .search-box input, .search-box select {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            padding: 0.4rem 0.6rem;
            font-size: 0.9rem;
        }

        .search-box select option {
            background: #111827;
            color: #fff;
        }

        .btn-scan {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: white;
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-scan:hover { opacity: 0.9; }

        .content-layout {
            display: flex;
            gap: 1rem;
            flex: 1;
            min-height: 0;
        }

        .map-wrapper {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            position: relative;
        }

        #map { width: 100%; height: 100%; }

        .sidebar {
            width: 380px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .item-card:hover {
            background: rgba(245, 158, 11, 0.08);
            border-color: rgba(245, 158, 11, 0.3);
        }

        .item-title { font-size: 0.85rem; font-weight: 600; margin-bottom: 0.25rem; }
        .item-meta { font-size: 0.75rem; color: var(--text-muted); }

        .badge {
            padding: 0.2rem 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <div class="logo-icon">🏭</div>
            <div>
                <div class="logo-title">BEDROCK</div>
                <div class="logo-subtitle">Infrastructures Critiques, Énergie, Défense & Industrie — Zero Fake Data</div>
            </div>
        </div>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
            <span class="badge" id="sourceBadge">OVERPASS OPEN DATA</span>
            <span class="badge" id="countBadge">0 SITE</span>
        </div>
    </header>

    <div class="search-container">
        <div class="search-box" style="flex: 2; min-width: 250px;">
            <span>📍</span>
            <input type="text" id="coordsInput" placeholder="Lat, Lon (ex: 48.8566, 2.3522)" value="49.49, 0.10" style="width: 100%;">
        </div>
        <div class="search-box">
            <span>📏</span>
            <select id="radiusSelect">
                <option value="1500">1.5 km</option>
                <option value="3000" selected>3 km</option>
                <option value="5000">5 km</option>
                <option value="10000">10 km</option>
            </select>
        </div>
        <div class="search-box">
            <span>🏷️</span>
            <select id="categorySelect">
                <option value="all" selected>Toutes catégories</option>
                <option value="energy">⚡ Énergie, Centrales & Pipelines</option>
                <option value="hazmat_storage">🛢️ Stockage Dangereux & Torches</option>
                <option value="mining">⛏️ Carrières & Mines</option>
                <option value="military_defense">🛡️ Défense, Prisons & Douanes</option>
                <option value="water_critical">💧 Eau, Barrages & Traitement</option>
                <option value="transport">🚢 Transports & Ports</option>
                <option value="telecom">📡 Télécoms & Data</option>
                <option value="industrial">🏭 Usines & Industrie</option>
                <option value="security_health">🏥 Santé & Secours</option>
            </select>
        </div>
        <button class="btn-scan" onclick="scannerZone()">Scanner la Zone</button>
    </div>

    <div class="content-layout">
        <div class="map-wrapper">
            <div id="map"></div>
        </div>
        <div class="sidebar">
            <div class="sidebar-header">
                <span>Infrastructures Détectées</span>
                <span style="font-size: 0.75rem; color: var(--text-muted);" id="statsHeader">-</span>
            </div>
            <div class="sidebar-list" id="infraList">
                <div style="text-align: center; color: var(--text-muted); font-size: 0.85rem; padding: 2rem;">
                    Sélectionnez un point et lancez un scan pour analyser les sites réels.
                </div>
            </div>
        </div>
    </div>

    <script>
        let map = L.map('map').setView([49.49, 0.10], 12);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: 'OpenStreetMap, Overpass API'
        }).addTo(map);

        let markersGroup = L.layerGroup().addTo(map);
        let centerCircle = null;

        const catColors = {
            energy: '#eab308',
            hazmat_storage: '#f43f5e',
            mining: '#a16207',
            military_defense: '#6366f1',
            water_critical: '#06b6d4',
            transport: '#3b82f6',
            telecom: '#8b5cf6',
            industrial: '#f97316',
            security_health: '#ef4444',
            other: '#6b7280'
        };

        async function scannerZone() {
            const raw = document.getElementById('coordsInput').value.trim();
            const radius = parseInt(document.getElementById('radiusSelect').value);
            const category = document.getElementById('categorySelect').value;

            const [lat, lon] = raw.split(',').map(n => parseFloat(n.trim()));
            if (isNaN(lat) || isNaN(lon)) {
                alert("Format invalide. Exemple: 49.49, 0.10");
                return;
            }

            map.setView([lat, lon], radius > 5000 ? 11 : 13);
            markersGroup.clearLayers();
            if (centerCircle) map.removeLayer(centerCircle);

            centerCircle = L.circle([lat, lon], {
                radius: radius,
                color: '#f59e0b',
                fillColor: '#f59e0b',
                fillOpacity: 0.05,
                weight: 1,
                dashArray: '4, 4'
            }).addTo(map);

            const listEl = document.getElementById('infraList');
            listEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 2rem;">Scan OSM Overpass en cours...</div>';

            try {
                const response = await fetch(`/api/v1/infrastructure?lat=${lat}&lon=${lon}&radius_m=${radius}&category=${category}`);
                const contract = await response.json();
                const elements = contract.result.elements || [];

                document.getElementById('countBadge').textContent = `${elements.length} SITE${elements.length > 1 ? 'S' : ''}`;
                document.getElementById('statsHeader').textContent = `${elements.length} actifs`;

                listEl.innerHTML = '';
                if (elements.length === 0) {
                    listEl.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 2rem;">Aucune infrastructure critique détectée dans ce rayon.</div>';
                    return;
                }

                elements.forEach((el, idx) => {
                    const color = catColors[el.category] || '#f59e0b';
                    const marker = L.circleMarker([el.lat, el.lon], {
                        radius: 7,
                        fillColor: color,
                        color: '#ffffff',
                        weight: 1,
                        fillOpacity: 0.85
                    }).addTo(markersGroup);

                    let techHtml = '';
                    const tech = el.technical_details || {};
                    if (tech.primary_source) techHtml += `<div style="font-size:0.8rem;"><strong>Source :</strong> ${tech.primary_source}</div>`;
                    if (tech.pipeline_substance) techHtml += `<div style="font-size:0.8rem;"><strong>Substance :</strong> ${tech.pipeline_substance}</div>`;
                    if (tech.content) techHtml += `<div style="font-size:0.8rem;"><strong>Contenu :</strong> ${tech.content}</div>`;
                    if (tech.military_type) techHtml += `<div style="font-size:0.8rem;"><strong>Type militaire :</strong> ${tech.military_type}</div>`;
                    if (tech.voltage_v) techHtml += `<div style="font-size:0.8rem;"><strong>Tension :</strong> ${tech.voltage_v} V</div>`;

                    marker.bindPopup(`
                        <div style="font-family:Inter; color:#1e293b; min-width:180px;">
                            <strong style="color:${color}; font-size:0.95rem;">${el.icon || '📍'} ${el.name}</strong><br/>
                            <div style="font-size:0.8rem; margin-top:4px;"><strong>Catégorie :</strong> ${el.category_label || el.category}</div>
                            <div style="font-size:0.8rem;"><strong>Sous-type :</strong> ${el.type}</div>
                            ${techHtml}
                            ${el.operator ? `<div style="font-size:0.8rem;"><strong>Opérateur :</strong> ${el.operator}</div>` : ''}
                            <div style="font-size:0.75rem; color:#64748b; margin-top:4px;">GPS: ${el.lat}, ${el.lon}</div>
                        </div>
                    `);

                    const card = document.createElement('div');
                    card.className = 'item-card';
                    card.innerHTML = `
                        <div class="item-title">${el.icon || '📍'} ${el.name}</div>
                        <div class="item-meta">
                            <span>${el.category_label || el.category}</span> • <span>${el.type}</span>
                            ${el.operator ? `<br/><span style="color:#fbbf24;">Opérateur: ${el.operator}</span>` : ''}
                        </div>
                    `;
                    card.onclick = () => {
                        map.setView([el.lat, el.lon], 16);
                        marker.openPopup();
                    };
                    listEl.appendChild(card);
                });

            } catch (err) {
                listEl.innerHTML = '<div style="text-align: center; color: #ef4444; padding: 2rem;">Erreur de connexion Overpass API. Réessayez dans un instant.</div>';
            }
        }

        map.on('click', (e) => {
            document.getElementById('coordsInput').value = `${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;
            scannerZone();
        });

        window.onload = scannerZone;
    </script>
</body>
</html>
